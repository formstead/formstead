<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Contact</title>
	<style>
		body {
			font-family: system-ui, sans-serif;
			line-height: 1.5;
			margin: 2rem;
		}

		form {
			max-width: 32rem;
		}

		label {
			font-weight: 600;
		}

		input,
		textarea {
			box-sizing: border-box;
			display: block;
			margin: 0.25rem 0 1rem;
			width: 100%;
		}

		.formstead-honeypot {
			position: absolute;
			left: -10000px;
			height: 1px;
			width: 1px;
			overflow: hidden;
		}
	</style>
</head>
<body>
	<main>
		<h1>Contact</h1>
		<form method="post" action="__FORMSTEAD_ENDPOINT__">
			<p>
				<label for="formstead-email">Email</label><br>
				<input id="formstead-email" name="email" type="email" autocomplete="email">
			</p>
			<p>
				<label for="formstead-message">Message</label><br>
				<textarea id="formstead-message" name="message"></textarea>
			</p>
			<div class="formstead-honeypot" aria-hidden="true">
				<label for="formstead-honeypot">Company</label>
				<input id="formstead-honeypot" name="_fs_honeypot" type="text" tabindex="-1" autocomplete="off">
			</div>
			<button type="submit">Send</button>
		</form>
	</main>
</body>
</html>
