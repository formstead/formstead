name: CI

# Started by hand on main after the last pull request of a plan.
# Pushes, pull requests, and the daily schedule do not start this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: PHPUnit (${{ matrix.php }} / ${{ matrix.wp }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.3"
            core: "WordPress/WordPress#7.0"
            wp: "7.0"
          - php: "8.4"
            core: "WordPress/WordPress#7.0"
            wp: "7.0"
          - php: "8.5"
            core: "WordPress/WordPress#7.0"
            wp: "7.0"
          - php: "8.3"
            core: "WordPress/WordPress#7.1.3"
            wp: "7.1"
          - php: "8.4"
            core: "WordPress/WordPress#7.1.3"
            wp: "7.1"
          - php: "8.5"
            core: "WordPress/WordPress#7.1.3"
            wp: "7.1"
          - php: "8.3"
            core: "WordPress/WordPress#master"
            wp: trunk
            experimental: true
    env:
      WP_ENV_PHP_VERSION: ${{ matrix.php }}
      WP_ENV_CORE: ${{ matrix.core }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Start wp-env
        run: npx wp-env start

      - name: Install Composer dependencies
        run: npx wp-env run cli --env-cwd=wp-content/plugins/formstead composer install --no-interaction --prefer-dist

      - name: PHPUnit
        run: npx wp-env run tests-cli --env-cwd=wp-content/plugins/formstead vendor/bin/phpunit --exclude-group explain,multisite

      # Static analysis and Mailpit stay on the primary supported pair.
      # The other cells only compare PHPUnit across PHP and WordPress.
      - name: PHPCS
        if: matrix.php == '8.3' && matrix.wp == '7.1'
        run: npx wp-env run cli --env-cwd=wp-content/plugins/formstead vendor/bin/phpcs

      - name: PHPStan
        if: matrix.php == '8.3' && matrix.wp == '7.1'
        run: npx wp-env run cli --env-cwd=wp-content/plugins/formstead vendor/bin/phpstan analyse --memory-limit=1G

      - name: Mailpit accepts one notification
        if: matrix.php == '8.3' && matrix.wp == '7.1'
        run: bash bin/ci/mailpit-check.sh

  mysql:
    name: PHPUnit on MySQL 8.0
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          extensions: mysqli
          tools: composer
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install WordPress tests
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 7.1.3

      - name: PHPUnit including index checks
        run: vendor/bin/phpunit --exclude-group multisite
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib

      - name: PHPUnit multisite
        run: WP_MULTISITE=1 vendor/bin/phpunit --group multisite
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib

  package:
    name: ZIP and Plugin Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mailpit:
        image: axllent/mailpit:v1.27.11
        ports:
          - 8025:8025
          - 1025:1025
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          extensions: mysqli, zip
          tools: composer, wp-cli:2.12.0
          coverage: none

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Build ZIP
        run: bash bin/build-zip.sh

      - name: Download WordPress
        run: wp core download --version=7.1.3 --path=wordpress --force

      - name: Create wp-config
        run: |
          wp config create \
            --path=wordpress \
            --dbname=wordpress \
            --dbuser=root \
            --dbpass=root \
            --dbhost=127.0.0.1 \
            --extra-php <<'PHP'
          define( 'WP_DEBUG', true );
          define( 'WP_DEBUG_LOG', true );
          define( 'WP_DEBUG_DISPLAY', false );
          define( 'FORMSTEAD_RATE_PER_MINUTE', 100 );
          PHP

      - name: Install WordPress
        run: |
          wp core install \
            --path=wordpress \
            --url=http://127.0.0.1:8080 \
            --title=Formstead \
            --admin_user=admin \
            --admin_password=password \
            --admin_email=admin@example.com \
            --skip-email

      - name: Install Formstead from ZIP
        run: wp plugin install formstead.zip --activate --path=wordpress

      # Keep 2.1.0 in sync with the plugin-check ZIP URL in .wp-env.json.
      # That file is strict JSON, so the pin cannot be commented there.
      - name: Install Plugin Check
        run: wp plugin install plugin-check --version=2.1.0 --activate --path=wordpress

      - name: Run Plugin Check
        run: |
          # The default Actions shell is `bash -e` without pipefail, so a failing
          # `wp plugin check` would otherwise be hidden by `tee`.
          set -o pipefail
          PCP_DIR="$(wp plugin path plugin-check --dir --path=wordpress)"
          wp plugin check formstead \
            --path=wordpress \
            --require="${PCP_DIR}/cli.php" \
            --format=json | tee plugin-check.json
          if grep -q '"type":"ERROR"' plugin-check.json; then
            echo "Plugin Check reported errors."
            exit 1
          fi
          echo "Plugin Check reported no errors."

      - name: Point package mail at Mailpit
        run: |
          mkdir -p wordpress/wp-content/mu-plugins
          cp bin/ci/package-mailpit.php wordpress/wp-content/mu-plugins/formstead-mailpit.php

      - name: Hit front, admin, and uninstall over PHP's built-in server
        run: |
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8080 -t wordpress >/tmp/php-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/; then
              break
            fi
            sleep 0.5
          done

          assert_ok() {
            local label="$1"
            local url="$2"
            local result
            # No -L: a redirect to wp-login.php stays a non-200. url_effective is only the requested URL.
            result="$(curl -s -b "$JAR" -o /dev/null -w '%{http_code} %{url_effective}' "$url")"
            echo "${label}:${result}"
            local code="${result%% *}"
            if [[ "$code" != "200" ]]; then
              echo "${label} did not return 200 at ${url}." >&2
              exit 1
            fi
          }

          assert_debug_log() {
            if [[ ! -s wordpress/wp-content/debug.log ]]; then
              echo "debug.log is absent or empty."
              return
            fi
            # wp-cli 2.12 logs its own PHP deprecations through WordPress while this step also runs wp.
            local plugin_lines
            plugin_lines="$(grep -v 'phar:///usr/local/bin/wp-cli/' wordpress/wp-content/debug.log || true)"
            if [[ -n "${plugin_lines//[[:space:]]/}" ]]; then
              echo "debug.log is not empty:"
              cat wordpress/wp-content/debug.log
              exit 1
            fi
            echo "debug.log has only wp-cli deprecations."
          }

          prefix="$(wp db prefix --path=wordpress)"
          assert_schema() {
            local found table
            found="$(wp db query "SHOW TABLES" --skip-column-names --path=wordpress)"
            for table in "${prefix}formstead_forms" "${prefix}formstead_submissions" "${prefix}formstead_form_versions" "${prefix}formstead_rate_limits" "${prefix}formstead_idempotency_keys" "${prefix}formstead_deliveries" "${prefix}formstead_identities" "${prefix}formstead_audit"; do
              if ! grep -Fxq "$table" <<<"$found"; then
                echo "Missing table ${table}." >&2
                printf '%s\n' "$found" >&2
                exit 1
              fi
            done
            echo "Formstead tables are present."
          }

          submission_count() {
            wp db query "SELECT COUNT(*) FROM ${prefix}formstead_submissions" --skip-column-names --path=wordpress | tr -d '[:space:]'
          }

          assert_schema
          db_version="$(wp option get formstead_db_version --path=wordpress)"
          if [[ "$db_version" != "8" ]]; then
            echo "Expected formstead_db_version 8, got ${db_version}." >&2
            exit 1
          fi

          public_id="$(wp eval-file bin/ci/seed-form.php --path=wordpress)"
          if [[ ! "$public_id" =~ ^fs_[a-z2-7]{16}$ ]]; then
            echo "Seed did not print a public id: ${public_id}" >&2
            exit 1
          fi
          endpoint="$(wp eval "echo rest_url( 'formstead/v1/forms/${public_id}/submissions' );" --path=wordpress)"
          echo "endpoint:${endpoint}"

          # Two requests with one key. Several workers make the posts overlap
          # so the database, not the web server, serializes them.
          idem_key="package-same-key"
          idem_headers_a="$(mktemp)"
          idem_headers_b="$(mktemp)"
          curl -s -D "$idem_headers_a" -o /tmp/formstead-idem-a -w '%{http_code}' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -H "Idempotency-Key: ${idem_key}" \
            --data 'email=idem-secret@example.com' \
            "$endpoint" > /tmp/formstead-idem-code-a &
          pid_a=$!
          curl -s -D "$idem_headers_b" -o /tmp/formstead-idem-b -w '%{http_code}' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -H "Idempotency-Key: ${idem_key}" \
            --data 'email=idem-secret@example.com' \
            "$endpoint" > /tmp/formstead-idem-code-b &
          pid_b=$!
          wait "$pid_a"
          wait "$pid_b"
          code_a="$(tr -d '[:space:]' < /tmp/formstead-idem-code-a)"
          code_b="$(tr -d '[:space:]' < /tmp/formstead-idem-code-b)"
          echo "post_idem_a:${code_a}"
          echo "post_idem_b:${code_b}"
          if [[ "$code_a" != "303" || "$code_b" != "303" ]]; then
            echo "Expected both idempotent posts to return 303." >&2
            cat "$idem_headers_a" >&2
            cat "$idem_headers_b" >&2
            exit 1
          fi
          if ! grep -Eq '^Location: https://example.com/thanks[[:space:]]*$' "$idem_headers_a"; then
            echo "First idempotent response did not redirect to the success URL." >&2
            cat "$idem_headers_a" >&2
            exit 1
          fi
          if ! grep -Eq '^Location: https://example.com/thanks[[:space:]]*$' "$idem_headers_b"; then
            echo "Second idempotent response did not redirect to the success URL." >&2
            cat "$idem_headers_b" >&2
            exit 1
          fi
          replay_count=0
          if grep -Eq '^Idempotent-Replayed: true[[:space:]]*$' "$idem_headers_a"; then
            replay_count=$((replay_count + 1))
          fi
          if grep -Eq '^Idempotent-Replayed: true[[:space:]]*$' "$idem_headers_b"; then
            replay_count=$((replay_count + 1))
          fi
          if [[ "$replay_count" != "1" ]]; then
            echo "Expected one replayed response, found ${replay_count}." >&2
            exit 1
          fi
          row_count="$(submission_count)"
          if [[ "$row_count" != "1" ]]; then
            echo "Expected 1 submission from the shared key, found ${row_count}." >&2
            exit 1
          fi

          conflict_code="$(curl -s -o /tmp/formstead-conflict -w '%{http_code}' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -H "Idempotency-Key: ${idem_key}" \
            --data 'email=other-secret@example.com' \
            "$endpoint")"
          echo "post_conflict:${conflict_code}"
          if [[ "$conflict_code" != "409" ]]; then
            echo "Expected 409 when the same key is reused with different content." >&2
            cat /tmp/formstead-conflict >&2
            exit 1
          fi
          if grep -q 'other-secret@example.com' /tmp/formstead-conflict; then
            echo "409 page echoed the submitted value." >&2
            exit 1
          fi
          row_count="$(submission_count)"
          if [[ "$row_count" != "1" ]]; then
            echo "Conflicting POST stored a row. Count is ${row_count}." >&2
            exit 1
          fi

          wp formstead deliveries run --path=wordpress
          for _attempt in $(seq 1 20); do
            if curl -sf -o /tmp/formstead-mailpit.json "http://127.0.0.1:8025/api/v1/messages"; then
              total="$(python3 -c 'import json; print(json.load(open("/tmp/formstead-mailpit.json")).get("total", 0))')"
              if [[ "$total" != "0" ]]; then
                break
              fi
            fi
            sleep 0.5
          done
          bash bin/ci/assert-one-mailpit-message.sh 8025 idem-secret@example.com

          invalid_headers="$(mktemp)"
          invalid_code="$(curl -s -D "$invalid_headers" -o /tmp/formstead-invalid-body -w '%{http_code}' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data 'extra=dropped-secret' \
            "$endpoint")"
          echo "post_invalid:${invalid_code}"
          if [[ "$invalid_code" != "422" ]]; then
            echo "Expected 422 when the required field is missing." >&2
            cat "$invalid_headers" >&2
            exit 1
          fi
          if ! grep -Eqi '^Content-Type:.*text/html' "$invalid_headers"; then
            echo "422 response was not text/html." >&2
            cat "$invalid_headers" >&2
            exit 1
          fi
          if ! grep -q '<ul>' /tmp/formstead-invalid-body; then
            echo "422 page did not list field errors." >&2
            cat /tmp/formstead-invalid-body >&2
            exit 1
          fi
          if grep -q 'dropped-secret' /tmp/formstead-invalid-body; then
            echo "422 page echoed the submitted value." >&2
            exit 1
          fi
          row_count="$(submission_count)"
          if [[ "$row_count" != "1" ]]; then
            echo "Invalid POST stored a row. Count is ${row_count}." >&2
            exit 1
          fi

          assert_status() {
            local label="$1"
            local expected="$2"
            local actual="$3"
            echo "${label}:${actual}"
            if [[ "$actual" != "$expected" ]]; then
              echo "${label} expected ${expected}, got ${actual}." >&2
              exit 1
            fi
          }

          json_headers="$(mktemp)"
          json_code="$(curl -s -D "$json_headers" -o /tmp/formstead-json-body -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data '{"email":"a@b.co"}' \
            "$endpoint")"
          assert_status post_json 201 "$json_code"
          if ! grep -Eq '"receipt_id"[[:space:]]*:[[:space:]]*"fsr_[a-z2-7]{16}"' /tmp/formstead-json-body; then
            echo "JSON success did not return a receipt id." >&2
            cat /tmp/formstead-json-body >&2
            exit 1
          fi
          if grep -q 'a@b.co' /tmp/formstead-json-body; then
            echo "JSON success echoed the submitted value." >&2
            exit 1
          fi

          bad_json_code="$(curl -s -o /tmp/formstead-bad-json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data '{' \
            "$endpoint")"
          assert_status post_bad_json 400 "$bad_json_code"
          if ! grep -q '"malformed_body"' /tmp/formstead-bad-json; then
            echo "Malformed JSON did not return malformed_body." >&2
            cat /tmp/formstead-bad-json >&2
            exit 1
          fi

          plain_code="$(curl -s -o /tmp/formstead-plain -w '%{http_code}' \
            -H 'Content-Type: text/plain' \
            -H 'Accept: application/json' \
            --data 'email=a@b.co' \
            "$endpoint")"
          assert_status post_plain 415 "$plain_code"
          if ! grep -q '"unsupported_media_type"' /tmp/formstead-plain; then
            echo "text/plain did not return unsupported_media_type." >&2
            cat /tmp/formstead-plain >&2
            exit 1
          fi

          printf 'secret' > /tmp/formstead-upload.txt
          file_code="$(curl -s -o /tmp/formstead-file -w '%{http_code}' \
            -F 'email=a@b.co' \
            -F 'upload=@/tmp/formstead-upload.txt' \
            "$endpoint")"
          assert_status post_file 415 "$file_code"
          if ! grep -q 'File uploads are not supported.' /tmp/formstead-file; then
            echo "File upload did not return the HTML refusal." >&2
            cat /tmp/formstead-file >&2
            exit 1
          fi
          if grep -q 'secret' /tmp/formstead-file; then
            echo "File upload echoed the submitted value." >&2
            exit 1
          fi

          multipart_headers="$(mktemp)"
          multipart_code="$(curl -s -D "$multipart_headers" -o /tmp/formstead-multipart -w '%{http_code}' \
            -F 'email=a@b.co' \
            "$endpoint")"
          assert_status post_multipart 303 "$multipart_code"
          if ! grep -Eq '^Location: https://example.com/thanks[[:space:]]*$' "$multipart_headers"; then
            echo "Multipart success did not redirect to the configured URL." >&2
            cat "$multipart_headers" >&2
            exit 1
          fi

          row_count="$(submission_count)"
          if [[ "$row_count" != "3" ]]; then
            echo "Expected 3 submissions after JSON and multipart success, found ${row_count}." >&2
            exit 1
          fi

          preflight_headers="$(mktemp)"
          preflight_code="$(curl -s -D "$preflight_headers" -o /dev/null -w '%{http_code}' \
            -X OPTIONS \
            -H 'Origin: https://forms.example' \
            -H 'Access-Control-Request-Method: POST' \
            "$endpoint")"
          assert_status preflight 204 "$preflight_code"
          if ! grep -Eq '^Access-Control-Allow-Origin: https://forms.example[[:space:]]*$' "$preflight_headers"; then
            echo "Allowed preflight did not grant the origin." >&2
            cat "$preflight_headers" >&2
            exit 1
          fi
          if grep -Eqi '^Access-Control-Allow-Credentials:' "$preflight_headers"; then
            echo "Preflight sent Access-Control-Allow-Credentials." >&2
            exit 1
          fi

          denied_headers="$(mktemp)"
          denied_code="$(curl -s -D "$denied_headers" -o /tmp/formstead-denied -w '%{http_code}' \
            -H 'Origin: https://evil.example' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data 'email=a@b.co' \
            "$endpoint")"
          assert_status post_foreign 403 "$denied_code"
          if grep -Eqi '^Access-Control-Allow-Origin:' "$denied_headers"; then
            echo "Rejected origin was granted CORS." >&2
            cat "$denied_headers" >&2
            exit 1
          fi
          if grep -Eqi '^Access-Control-Allow-Credentials:' "$denied_headers"; then
            echo "Rejected origin sent Access-Control-Allow-Credentials." >&2
            exit 1
          fi
          row_count="$(submission_count)"
          if [[ "$row_count" != "3" ]]; then
            echo "Rejected origin stored a row. Count is ${row_count}." >&2
            exit 1
          fi

          assert_no_credentials() {
            local label="$1"
            local headers="$2"
            if grep -Eqi '^Access-Control-Allow-Credentials:' "$headers"; then
              echo "${label} sent Access-Control-Allow-Credentials." >&2
              cat "$headers" >&2
              exit 1
            fi
          }

          allowed_headers="$(mktemp)"
          allowed_code="$(curl -s -D "$allowed_headers" -o /dev/null -w '%{http_code}' \
            -H 'Origin: https://forms.example' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data 'email=a@b.co' \
            "$endpoint")"
          assert_status post_allowed_origin 303 "$allowed_code"
          if ! grep -Eq '^Access-Control-Allow-Origin: https://forms.example[[:space:]]*$' "$allowed_headers"; then
            echo "Allowed origin was not granted CORS." >&2
            cat "$allowed_headers" >&2
            exit 1
          fi
          assert_no_credentials "Allowed origin" "$allowed_headers"

          allowed_invalid_headers="$(mktemp)"
          allowed_invalid_code="$(curl -s -D "$allowed_invalid_headers" -o /tmp/formstead-allowed-invalid -w '%{http_code}' \
            -H 'Origin: https://forms.example' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data 'extra=dropped-secret' \
            "$endpoint")"
          assert_status post_allowed_invalid 422 "$allowed_invalid_code"
          assert_no_credentials "Invalid allowed origin" "$allowed_invalid_headers"
          if grep -q 'dropped-secret' /tmp/formstead-allowed-invalid; then
            echo "Allowed-origin 422 echoed the submitted value." >&2
            exit 1
          fi

          allowed_json_headers="$(mktemp)"
          allowed_json_code="$(curl -s -D "$allowed_json_headers" -o /tmp/formstead-allowed-json -w '%{http_code}' \
            -H 'Origin: https://forms.example' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data '{"email":"a@b.co"}' \
            "$endpoint")"
          assert_status post_allowed_json 201 "$allowed_json_code"
          if ! grep -Eq '^Access-Control-Allow-Origin: https://forms.example[[:space:]]*$' "$allowed_json_headers"; then
            echo "Allowed JSON response did not grant the origin." >&2
            cat "$allowed_json_headers" >&2
            exit 1
          fi
          assert_no_credentials "Allowed JSON" "$allowed_json_headers"
          if grep -q 'a@b.co' /tmp/formstead-allowed-json; then
            echo "Allowed JSON success echoed the submitted value." >&2
            exit 1
          fi

          row_count="$(submission_count)"
          if [[ "$row_count" != "5" ]]; then
            echo "Expected 5 submissions after allowed-origin posts, found ${row_count}." >&2
            exit 1
          fi

          core_headers="$(mktemp)"
          core_endpoint="$(wp eval "echo rest_url( 'wp/v2/types' );" --path=wordpress)"
          core_code="$(curl -s -D "$core_headers" -o /dev/null -w '%{http_code}' \
            -X OPTIONS \
            -H 'Origin: https://other.example' \
            -H 'Access-Control-Request-Method: GET' \
            "$core_endpoint")"
          assert_status core_preflight 200 "$core_code"
          if ! grep -Eq '^Access-Control-Allow-Origin: https://other.example[[:space:]]*$' "$core_headers"; then
            echo "wp/v2 lost the core CORS origin header." >&2
            cat "$core_headers" >&2
            exit 1
          fi
          if ! grep -Eqi '^Access-Control-Allow-Credentials: true[[:space:]]*$' "$core_headers"; then
            echo "wp/v2 lost the core credentialed CORS header." >&2
            cat "$core_headers" >&2
            exit 1
          fi

          JAR="$(mktemp)"
          curl -sf -o /dev/null -w 'front:%{http_code} %{url_effective}\n' http://127.0.0.1:8080/
          curl -sf -c "$JAR" -b "$JAR" -o /dev/null -w 'login:%{http_code} %{url_effective}\n' http://127.0.0.1:8080/wp-login.php
          # The login form sets this cookie in JavaScript. curl does not run it, and an empty test cookie rejects the POST.
          printf '127.0.0.1\tFALSE\t/\tFALSE\t0\twordpress_test_cookie\t1\n' >> "$JAR"
          login_post="$(curl -s -c "$JAR" -b "$JAR" -o /dev/null -w '%{http_code} %{redirect_url}' \
            -d 'log=admin&pwd=password&wp-submit=Log+In&redirect_to=http%3A%2F%2F127.0.0.1%3A8080%2Fwp-admin%2F&testcookie=1' \
            http://127.0.0.1:8080/wp-login.php)"
          echo "login_post:${login_post}"
          if [[ "$login_post" != 302* || "$login_post" != *wp-admin* || "$login_post" == *wp-login.php* ]]; then
            echo "Login did not redirect to wp-admin." >&2
            exit 1
          fi

          assert_ok admin http://127.0.0.1:8080/wp-admin/
          assert_ok plugins http://127.0.0.1:8080/wp-admin/plugins.php
          assert_debug_log

          wp plugin deactivate formstead --path=wordpress
          wp plugin uninstall formstead --path=wordpress
          assert_schema
          assert_debug_log

          # Opt-in uninstall removes tables, options, and capabilities.
          wp plugin install formstead.zip --activate --path=wordpress
          wp option update formstead_delete_data_on_uninstall 1 --path=wordpress
          wp plugin uninstall formstead --deactivate --path=wordpress

          found="$(wp db query "SHOW TABLES" --skip-column-names --path=wordpress)"
          while IFS= read -r table; do
            if [[ "$table" == "${prefix}formstead_"* ]]; then
              echo "Table ${table} remained after the opt-in uninstall." >&2
              exit 1
            fi
          done <<<"$found"

          options="$(wp db query "SELECT option_name FROM ${prefix}options" --skip-column-names --path=wordpress)"
          while IFS= read -r name; do
            if [[ "$name" == formstead_* || "$name" == _transient_formstead_* || "$name" == _transient_timeout_formstead_* ]]; then
              echo "Option ${name} remained after the opt-in uninstall." >&2
              exit 1
            fi
          done <<<"$options"

          wp eval '
            $role = get_role( "administrator" );
            if ( ! $role ) {
              fwrite( STDERR, "The administrator role is missing.\n" );
              exit( 1 );
            }
            foreach ( array( "formstead_manage_forms", "formstead_read_submissions", "formstead_export_submissions", "formstead_delete_submissions" ) as $cap ) {
              if ( $role->has_cap( $cap ) ) {
                fwrite( STDERR, "Capability {$cap} remained after uninstall.\n" );
                exit( 1 );
              }
            }
          ' --path=wordpress
          echo "Opt-in uninstall removed Formstead data."
          assert_debug_log

      - name: Upload ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: formstead
          path: formstead.zip

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Start wp-env
        run: npx wp-env start

      - name: Install Composer dependencies
        run: npx wp-env run cli --env-cwd=wp-content/plugins/formstead composer install --no-interaction --prefer-dist

      - name: Start Mailpit
        run: bash bin/mailpit.sh up

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Seed the tests site
        run: npm run e2e:setup

      - name: Build the Next.js example and verify the signature
        run: |
          npm ci --prefix examples/next
          npm run build --prefix examples/next
          npm test --prefix examples/next

      - name: Playwright
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  legacy-php-lint:
    name: PHP 7.4 syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "7.4"
          coverage: none
          tools: none

      - name: Lint formstead.php on PHP 7.4
        run: php -l formstead.php

